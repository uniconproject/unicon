# GitHub Pages site under /unicon/ (github.io project pages).
#
# Built by config/scripts/gh-pages/build-gh-pages-site.sh (pandoc + nav).
# Also builds the uscribe user guide (doc/uscribe) so generated HTML
# and uscribe-userguide.pdf are included under doc/uscribe/out/, and
# RST Unicon Technical Reports (make -C doc/utr html) under doc/utr/html/.
#
# Upstream (uniconproject/unicon): a push to master/main builds the site
# and publishes it with actions/deploy-pages. Generated HTML is not in
# git, so "Deploy from a branch → master" cannot serve it (Jekyll on the
# source tree also cannot). Settings → Pages → Source: GitHub Actions.
#
# Forks: still push the same tree to that fork's gh-pages branch
# (peaceiris), e.g. https://jafaral.github.io/unicon/ — set the fork's
# Pages source to branch gh-pages / (root).
#
# Fork PRs against upstream: GITHUB_TOKEN cannot publish the project
# site. Preview on the fork after a push there (forks may still use a
# gh-pages branch). The project site updates when the PR merges to
# master.

name: Pages

on:
  push:
    # Upstream deploys only from master/main (job if). Forks deploy any branch.
    branches:
      - '**'
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'COPYING'
      - 'doc/**'
      - 'uni/uscribe/**'
      - 'config/editor/**'
      - 'config/scripts/gh-pages/**'
      - '.github/workflows/pages.yml'
      - 'debian/control'
      - 'configure.ac'
      - 'Makefile'
      - 'Makedefs*'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'COPYING'
      - 'doc/**'
      - 'uni/uscribe/**'
      - 'config/editor/**'
      - 'config/scripts/gh-pages/**'
      - '.github/workflows/pages.yml'
      - 'debian/control'
      - 'configure.ac'
      - 'Makefile'
      - 'Makedefs*'
  workflow_dispatch:
  # Re-deploy after Binary Packages finishes so /unicon/downloads/ picks up the packages
  # built from the commit that just landed, without the docs-only push having to wait on
  # the (much longer) package build matrix first.
  workflow_run:
    workflows: ['Binary Packages']
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  # actions: read lets the build job's `gh run download` pull the latest Binary Packages
  # artifacts (deb/rpm) into the downloads page.
  actions: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      (
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          (
            github.event.workflow_run.head_branch == 'master' ||
            github.event.workflow_run.head_branch == 'main'
          )
        )
      ) &&
      (
        github.repository == 'uniconproject/unicon' ||
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      (
        github.repository != 'uniconproject/unicon' ||
        github.event_name != 'push' ||
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Pandoc and TeX (uscribe PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended

      - name: Install Unicon build dependencies
        run: |
          sudo apt-get install -q -y devscripts equivs
          sudo mk-build-deps --install debian/control

      - name: Configure Unicon (no graphics/iconc; enough for uscribe)
        run: ./configure --disable-graphics --disable-iconc

      - name: Build Unicon
        run: make -j"$(nproc)"

      - name: Build uscribe user guide HTML and PDF
        run: |
          make -C doc/uscribe html pdf
          test -f doc/uscribe/out/index.html
          test -f doc/uscribe/out/uscribe-userguide.pdf

      - name: Build RST Unicon Technical Reports
        run: |
          make -C doc/utr pdf-rst
          make -C doc/utr html
          test -f doc/utr/html/index.html
          # Every RST report in utr.manifest must have been rendered.
          while read -r src; do
            case "$src" in
              ''|\#*) continue ;;
            esac
            base="${src%.rst}"
            test -f "doc/utr/html/${base}.html"
          done < doc/utr/utr.manifest

      - name: Build site
        env:
          UNICON_SITE_PREFIX: /unicon
        run: bash config/scripts/gh-pages/build-gh-pages-site.sh _site

      # Dev/deploy download links only — unsigned, straight from CI. The signed
      # apt/dnf repos (components dev, rc, release) are published locally from
      # the repo-incoming artifact. See config/scripts/pkg-repo/.
      - name: Fetch latest Binary Packages artifacts
        if: github.repository == 'uniconproject/unicon'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # workflow_run carries the package run that just finished, and only when
          # that run was on master or main. A manual dispatch from another branch
          # must not publish here. Other events leave this empty and the script
          # looks up the latest success on master.
          PACKAGE_RUN_ID: ${{ github.event_name == 'workflow_run' && (github.event.workflow_run.head_branch == 'master' || github.event.workflow_run.head_branch == 'main') && github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          mkdir -p _site/downloads
          run_id="${PACKAGE_RUN_ID}"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --workflow packages.yml --branch master --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          if [ -z "$run_id" ]; then
            echo "No successful Binary Packages run yet for master; downloads page will say so."
          else
            echo "Pulling package artifacts from Binary Packages run ${run_id}"
            # gh accepts a single --pattern; a second copy replaces the first.
            got=0
            for pat in 'deb-*' 'rpm-*' 'arch-*' 'win-*'; do
              if gh run download "$run_id" --pattern "$pat" --dir _site/downloads; then
                got=1
              else
                echo "No artifacts matched ${pat}"
              fi
            done
            if [ "$got" -eq 1 ]; then
              echo "$run_id" > _site/downloads/.run_id
            fi
          fi

      - name: Build downloads index page
        run: |
          set -euo pipefail
          mkdir -p _site/downloads
          out=_site/downloads/index.html
          run_note='<p><em>No successful package build yet.</em></p>'
          if [ -f _site/downloads/.run_id ]; then
            rid=$(cat _site/downloads/.run_id)
            run_note="<p>From <a href=\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${rid}\">Binary Packages run ${rid}</a>.</p>"
            rm -f _site/downloads/.run_id
          fi
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<title>Unicon downloads</title>'
            cat config/scripts/gh-pages/includes/header.html
            echo '</head><body>'
            cat config/scripts/gh-pages/includes/before-body.html
            echo '<main style="max-width:60rem;margin:2rem auto;padding:0 1rem;font-family:sans-serif">'
            echo '<h1>Development package downloads</h1>'
            echo '<p>Built automatically from the latest <code>master</code> commit.'
            echo ' These are <strong>unsigned development builds</strong>, not an'
            echo ' apt or dnf repository. Signed release packages are published'
            echo ' separately per tagged release.'
            echo ' A path containing <code>nographics</code> is built with'
            echo ' <code>--disable-graphics --disable-audio</code> and has no GUI,'
            echo ' IDE, 3D library, or audio.</p>'
            echo "$run_note"
            for kind_label in 'deb:Debian / Ubuntu (.deb)' 'rpm:Fedora / Rocky Linux (.rpm)' 'arch:Arch Linux / CachyOS' 'win:Windows'; do
              kind="${kind_label%%:*}"
              label="${kind_label#*:}"
              echo "<h2>${label}</h2>"
              case "$kind" in
                deb)
                  echo '<p>Download the package for your release and architecture,'
                  echo ' for example Ubuntu 24.04 amd64 or Debian 13 arm64.'
                  echo ' From the directory where you saved it:</p>'
                  echo '<pre><code>sudo apt install "./unicon_&lt;version&gt;_&lt;arch&gt;.deb"</code></pre>'
                  echo '<p>Quote the filename. It contains <code>~</code>, which the shell'
                  echo ' would otherwise treat as your home directory.'
                  echo ' <code>apt</code> installs the shared libraries the package needs.'
                  echo ' A local file is not signed, and apt may say so; that is expected.'
                  echo ' <code>dpkg -i</code> does not install those libraries. If you use it,'
                  echo ' run <code>sudo apt-get -f install</code> afterward.</p>'
                  ;;
                rpm)
                  echo '<p>Download the Fedora 44 or Rocky Linux 9 x86_64 package that'
                  echo ' matches your system. The two are not interchangeable.'
                  echo ' From the directory where you saved it:</p>'
                  echo '<pre><code>sudo dnf install "./unicon-&lt;version&gt;.rpm"</code></pre>'
                  echo '<p>Quote the filename because it contains <code>~</code>.'
                  echo ' <code>dnf</code> installs the dependencies.'
                  echo ' <code>rpm -i</code> does not.</p>'
                  ;;
                arch)
                  echo '<p>Download either the Arch Linux or the CachyOS directory.'
                  echo ' They are built in different containers and are not'
                  echo ' interchangeable. From the graphics directory, skip the'
                  echo ' no-graphics packages. They conflict with this set:</p>'
                  echo '<pre><code>sudo pacman -U $(ls ./*.pkg.tar.zst | grep -v nographics)</code></pre>'
                  echo '<p>The <code>nographics</code> directory contains only'
                  echo ' <code>unicon-runtime-nographics</code>.</p>'
                  ;;
                win)
                  echo '<p>Download the 64-bit <code>.exe</code> and run it. The installer'
                  echo ' is unsigned, so Windows may report an unknown publisher.'
                  echo ' It adds the Unicon <code>bin</code> directory to the system'
                  echo ' <code>PATH</code>. Open a new terminal after installation so the'
                  echo ' updated path is picked up.</p>'
                  ;;
              esac
              echo '<ul>'
              found=0
              for d in _site/downloads/"${kind}"-*/; do
                [ -d "$d" ] || continue
                for f in "$d"*; do
                  [ -f "$f" ] || continue
                  case "$f" in
                    *.deb|*.rpm|*.exe|*.pkg.tar.zst) ;;
                    *) continue ;;
                  esac
                  rel="${f#_site/downloads/}"
                  echo "<li><a href=\"${rel}\">${rel}</a></li>"
                  found=1
                done
              done
              if [ "$found" -eq 0 ]; then
                echo '<li><em>none yet</em></li>'
              fi
              echo '</ul>'
            done
            echo '</main>'
            cat config/scripts/gh-pages/includes/after-body.html
            echo '</body></html>'
          } > "$out"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 3

  deploy-production:
    # uniconproject: publish a master/main push, a manual dispatch, or a Binary Packages
    # run whose head branch is master or main. workflow_run sets github.ref to the
    # default branch even when the package run was started from somewhere else, so the
    # triggering head branch has to be checked on its own.
    if: >-
      github.repository == 'uniconproject/unicon' &&
      github.event_name != 'pull_request' &&
      (
        github.event.workflow_run.head_branch == 'master' ||
        github.event.workflow_run.head_branch == 'main' ||
        (
          github.event_name != 'workflow_run' &&
          (
            github.ref == 'refs/heads/master' ||
            github.ref == 'refs/heads/main' ||
            github.event_name == 'workflow_dispatch'
          )
        )
      )
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-production-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  deploy-fork:
    # Forks: any push/dispatch → that fork's gh-pages branch.
    if: >-
      github.repository != 'uniconproject/unicon' &&
      github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-gh-pages-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Deploy to gh-pages (site root)
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: true
          commit_message: "Deploy Pages ${{ github.sha }}"

  # Fork PRs cannot publish uniconproject.github.io; point authors at the fork.
  skip-preview-fork:
    if: >-
      github.repository == 'uniconproject/unicon' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Note fork preview location
        env:
          FORK_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        run: |
          echo "### Pages preview skipped on upstream"
          echo "This fork PR does not publish https://uniconproject.github.io/unicon/"
          echo "The project site updates when the PR merges to master."
          echo "Live preview (after push to the fork with Pages enabled):"
          echo "  https://${FORK_OWNER}.github.io/unicon/"
          echo "  https://${FORK_OWNER}.github.io/unicon/doc/uscribe/out/"
          echo "  https://${FORK_OWNER}.github.io/unicon/doc/utr/html/"

      - name: Comment that fork PR preview was skipped
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const owner = context.payload.pull_request.head.repo.owner.login;
            const forkSite = `https://${owner}.github.io/unicon/`;
            const guide = `${forkSite}doc/uscribe/out/`;
            const utr = `${forkSite}doc/utr/html/`;
            const marker = '<!-- pages-pr-preview-skipped -->';
            const body =
              `${marker}\n` +
              `### Pages preview skipped on upstream\n\n` +
              `This PR is from a fork, so it cannot publish ` +
              `https://uniconproject.github.io/unicon/.\n\n` +
              `The project site updates when this merges to \`master\`. ` +
              `For a live preview, push to your fork (Actions enabled; ` +
              `Pages → Deploy from a branch \`gh-pages\` / (root)). ` +
              `Site:\n` +
              `- ${forkSite}\n` +
              `- uscribe guide: ${guide}\n` +
              `- Technical reports (RST): ${utr}\n`;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
              });
              if (comments.some(c => c.body && c.body.includes(marker))) return;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            } catch (err) {
              core.warning(
                `Could not comment on PR #${pr} (fork PRs often lack ` +
                `pull-requests: write): ${err.message}`
              );
            }

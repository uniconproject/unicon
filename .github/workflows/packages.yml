name: Binary Packages
on:
  push:
    branches:
      - master
    paths-ignore:
      - 'doc/**'
      - 'docs/**'
      - '.readthedocs.yaml'
      - 'config/scripts/gh-pages/**'
      - 'config/editor/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'COPYING'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RTT_JOBS: "16"

jobs:
  Windows:
    runs-on: ${{ matrix.cfg.os }}
    name: ${{ matrix.cfg.name }}
    timeout-minutes: 120
    strategy:
      matrix:
        cfg:
        -  { os: windows-2022,  name: 'Windows_64-bit',  opt: '' }
        #-  { os: windows-latest,  name: 'Windows_32-bit', opt: '--build=i686-w64-mingw32 --host=i686-w64-mingw32' }

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-diffutils
          mingw-w64-ucrt-x86_64-openssl
          mingw-w64-ucrt-x86_64-libssh
          mingw-w64-ucrt-x86_64-libpng
          mingw-w64-ucrt-x86_64-libjpeg-turbo
          make
          git

    - run: git config --global core.autocrlf input
      shell: bash

    - name: Checkout
      uses: actions/checkout@v6

    # Two full installers, graphics and no-graphics. Each one is a single
    # setup program; the deb/rpm package split is not applied here.
    # msys2 setup is shared. The second configure is a clean rebuild so
    # --disable-graphics is not mixed with objects from the graphics build.
    - name: Graphics installer
      run: |
        sh configure --enable-uniconx ${{ matrix.cfg.opt }}
        make -j8
        make WinInstaller
        mkdir -p win-pkg
        cp Output/setup-unicon*.exe win-pkg/

    - name: Publish
      uses: actions/upload-artifact@v6
      with:
        name: win-${{ matrix.cfg.name }}
        path: win-pkg/setup-unicon*.exe
        if-no-files-found: warn

    - name: No-graphics installer
      run: |
        make distclean
        rm -f Output/setup-unicon*.exe
        sh configure --disable-graphics --disable-audio --enable-uniconx ${{ matrix.cfg.opt }}
        make -j8
        make WinInstaller
        mkdir -p win-pkg-nographics
        cp Output/setup-unicon*.exe win-pkg-nographics/

    - name: Publish no-graphics
      uses: actions/upload-artifact@v6
      with:
        name: win-${{ matrix.cfg.name }}-nographics
        path: win-pkg-nographics/setup-unicon*.exe
        if-no-files-found: warn

  # Containerized so coverage isn't limited to whichever distro versions GitHub happens to
  # ship as hosted runner images (e.g. no ubuntu-26.04 runner label yet). amd64 uses the
  # ubuntu-latest host; arm64 uses the ubuntu-24.04-arm host (already proven in build.yml's
  # Features job) — both just run the target distro's container on top.
  Deb:
    runs-on: ${{ matrix.cfg.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    name: ${{ matrix.cfg.name }}
    container: ${{ matrix.cfg.image }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # deb_rev is the Debian revision only. The upstream version (and the
        # .orig.tar.gz filename) is shared; assemble-repo-incoming.sh copies
        # one orig into every suite. upload_orig is the canonical suite
        # (trixie amd64), matching canonical_source_dist in
        # config/scripts/pkg-repo/distros.sh.
        cfg:
        - { image: 'ubuntu:22.04', arch: amd64, name: 'Ubuntu-22.04_amd64', codename: jammy,    deb_rev: '1~ubuntu22.04.1', upload_source: true,  upload_orig: false }
        - { image: 'ubuntu:24.04', arch: amd64, name: 'Ubuntu-24.04_amd64', codename: noble,    deb_rev: '1~ubuntu24.04.1', upload_source: true,  upload_orig: false }
        - { image: 'ubuntu:26.04', arch: amd64, name: 'Ubuntu-26.04_amd64', codename: resolute, deb_rev: '1~ubuntu26.04.1', upload_source: true,  upload_orig: false }
        - { image: 'debian:12',    arch: amd64, name: 'Debian-12_amd64',    codename: bookworm, deb_rev: '1~deb12u1',       upload_source: true,  upload_orig: false }
        - { image: 'debian:13',    arch: amd64, name: 'Debian-13_amd64',    codename: trixie,   deb_rev: '1~deb13u1',       upload_source: true,  upload_orig: true }
        - { image: 'ubuntu:22.04', arch: arm64, name: 'Ubuntu-22.04_arm64', codename: jammy,    deb_rev: '1~ubuntu22.04.1', upload_source: false, upload_orig: false }
        - { image: 'ubuntu:24.04', arch: arm64, name: 'Ubuntu-24.04_arm64', codename: noble,    deb_rev: '1~ubuntu24.04.1', upload_source: false, upload_orig: false }
        - { image: 'ubuntu:26.04', arch: arm64, name: 'Ubuntu-26.04_arm64', codename: resolute, deb_rev: '1~ubuntu26.04.1', upload_source: false, upload_orig: false }
        - { image: 'debian:12',    arch: arm64, name: 'Debian-12_arm64',    codename: bookworm, deb_rev: '1~deb12u1',       upload_source: false, upload_orig: false }
        - { image: 'debian:13',    arch: arm64, name: 'Debian-13_arm64',    codename: trixie,   deb_rev: '1~deb13u1',       upload_source: false, upload_orig: false }

    steps:
    - name: Install git for checkout
      run: |
        apt-get update -q -y
        DEBIAN_FRONTEND=noninteractive apt-get install -q -y git

    - name: Checkout
      uses: actions/checkout@v6

    - name: Cache apt packages
      uses: actions/cache@v5
      with:
        path: /var/cache/apt/archives/*.deb
        key: apt-deb-${{ matrix.cfg.image }}-${{ matrix.cfg.arch }}-${{ hashFiles('debian/control') }}
        restore-keys: apt-deb-${{ matrix.cfg.image }}-${{ matrix.cfg.arch }}-

    - name: Install dependencies
      # Running as root in the container, so no sudo; mk-build-deps needs -t to know how
      # to invoke apt-get non-interactively for the same reason.
      run: |
        apt-get update -q -y
        DEBIAN_FRONTEND=noninteractive apt-get install -q -y build-essential fakeroot devscripts equivs
        # dh-autoreconf is a separate package on older Debian/Ubuntu and folded
        # into debhelper later. debian/rules still asks for the addon.
        if apt-cache show dh-autoreconf >/dev/null 2>&1; then
          DEBIAN_FRONTEND=noninteractive apt-get install -q -y dh-autoreconf
        fi
        mk-build-deps --install debian/control -t "apt-get -o Debug::pkgProblemResolver=yes -y --no-install-recommends"

    # Both builds share one upstream version. The second is
    # --disable-graphics --disable-audio and, via DEB_BUILD_PROFILES=pkg.unicon.nographics, ships
    # only unicon-runtime-nographics. The dist tree is removed between
    # them so the second debuild starts clean.
    - name: Deb
      env:
        UNICON_DEB_REV: ${{ matrix.cfg.deb_rev }}
        UNICON_DEB_CODENAME: ${{ matrix.cfg.codename }}
        UPLOAD_SOURCE: ${{ matrix.cfg.upload_source }}
        UPLOAD_ORIG: ${{ matrix.cfg.upload_orig }}
      run: |
        # configure writes Makedefs (package name and version). make debin
        # runs distclean, which must not invent those from Makedefs.in.
        ./configure
        # POSIX: container jobs use sh. debian-pkg is the downloads-page
        # artifact (debs only). debian-repo is what the apt repo consumes
        # and, on amd64, includes the .dsc and .debian.tar.*.
        save_debs() {
          dest="$1"
          mkdir -p "$dest"
          # Every binary package, not only unicon_*.deb. A later split
          # (runtime, translator, ipl, gui, tools) uses names like
          # unicon-runtime_*.deb, which the unicon_ prefix does not match.
          for f in ../unicondist/*.deb ../unicondist/*.ddeb; do
            if [ -f "$f" ]; then
              cp "$f" "$dest/"
            fi
          done
        }
        save_source() {
          dest="$1"
          if [ "$UPLOAD_SOURCE" != "true" ]; then
            return 0
          fi
          mkdir -p "$dest"
          cp ../unicondist/unicon_*.dsc "$dest/"
          cp ../unicondist/unicon_*.debian.tar.* "$dest/"
          for f in ../unicondist/unicon_*.changes ../unicondist/unicon_*.buildinfo; do
            if [ -f "$f" ]; then
              cp "$f" "$dest/"
            fi
          done
          if [ "$UPLOAD_ORIG" = "true" ]; then
            cp ../unicondist/unicon_*.orig.tar.* "$dest/"
          fi
        }
        base="${GITHUB_RUN_NUMBER}.$(printf %.12s "$GITHUB_SHA")"
        rm -rf ../unicondist
        export UNICON_PKG_REV="$base"
        unset UNICON_CONFIGURE_EXTRA
        make debin
        # Keep the first packages outside the tree. The next make debin runs
        # make dist, which archives the checkout.
        save_debs "${RUNNER_TEMP}/debian-pkg"
        save_debs "${RUNNER_TEMP}/debian-repo"
        save_source "${RUNNER_TEMP}/debian-repo"
        rm -rf ../unicondist
        export UNICON_PKG_REV="$base"
        export UNICON_CONFIGURE_EXTRA="--disable-graphics --disable-audio"
        make debin
        mkdir -p debian-pkg debian-pkg-nographics debian-repo debian-repo-nographics
        cp "${RUNNER_TEMP}/debian-pkg/"*.deb debian-pkg/
        cp -a "${RUNNER_TEMP}/debian-repo/." debian-repo/
        save_debs debian-pkg-nographics
        save_debs debian-repo-nographics
        # No second .dsc. The graphics build already uploaded the source,
        # and a second .changes would collide with it.
        # Installed ucode links libraries by the absolute path they were
        # compiled at. Drop the build tree before make Test so those paths
        # miss and the linker uses the installed copies.
        rm -rf ../unicondist

    - name: Publish
      uses: actions/upload-artifact@v6
      with:
        name: deb-${{ matrix.cfg.name }}
        path: |
          debian-pkg/*.deb
          debian-pkg/*.ddeb
        if-no-files-found: warn

    - name: Publish no-graphics
      uses: actions/upload-artifact@v6
      with:
        name: deb-${{ matrix.cfg.name }}-nographics
        path: |
          debian-pkg-nographics/*.deb
          debian-pkg-nographics/*.ddeb
        if-no-files-found: warn

    # Separate from deb-* so the downloads page does not publish orig tarballs.
    - name: Publish repo
      uses: actions/upload-artifact@v6
      with:
        name: repo-deb-${{ matrix.cfg.name }}
        path: debian-repo/*
        if-no-files-found: error

    - name: Publish repo no-graphics
      uses: actions/upload-artifact@v6
      with:
        name: repo-deb-${{ matrix.cfg.name }}-nographics
        path: debian-repo-nographics/*
        if-no-files-found: error

    - name: Install and test
      # Container jobs use sh, not bash, so this stays POSIX (no shopt, no arrays).
      # unicon-runtime and unicon-runtime-nographics conflict, so the test
      # install is the graphics set. The nographics package is checked
      # on its own below.
      run: |
        # unicon-nographics depends on unicon-runtime-nographics, which is
        # built by the other configure and is not in this directory.
        set --
        for f in ./debian-pkg/*.deb; do
          case "$f" in
            ./debian-pkg/unicon-nographics_*) continue ;;
          esac
          if [ -f "$f" ]; then
            set -- "$@" "$f"
          fi
        done
        if [ ! -f "$1" ]; then
          echo "No .deb packages under debian-pkg/; did the Deb step succeed?"
          exit 1
        fi
        apt-get install -y "$@"
        make Test
        dpkg-deb -f ./debian-pkg/unicon-nographics_*.deb Depends | grep -q unicon-runtime-nographics
        set -- ./debian-pkg-nographics/unicon-runtime-nographics_*.deb
        if [ ! -f "$1" ]; then
          echo "No unicon-runtime-nographics package under debian-pkg-nographics/"
          exit 1
        fi
        # Package is unicon-runtime-nographics, so a combined grep matches
        # the name and never reaches Provides or Conflicts.
        test "$(dpkg-deb -f "$1" Package)" = unicon-runtime-nographics
        test "$(dpkg-deb -f "$1" Provides)" = unicon-vm
        test "$(dpkg-deb -f "$1" Conflicts)" = unicon-runtime
      env:
        UC: unicon

  # rpm/unicon.spec's Version/Source0 are parameterized on the %{ver} macro (make rpmbin
  # passes --define "ver <version>"), so this always builds the actual checked-out version
  # rather than the spec's last hand-bumped fallback.
  Rpm:
    runs-on: ubuntu-latest
    name: ${{ matrix.cfg.name }}
    container: ${{ matrix.cfg.image }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cfg:
        -  { image: 'fedora:44',              name: 'Fedora-44_amd64' }
        -  { image: 'rockylinux:9',           name: 'RockyLinux-9_amd64' }
        -  { image: 'opensuse/leap:16.0',     name: 'OpenSUSE-Leap-16.0_amd64' }
        -  { image: 'opensuse/tumbleweed:latest', name: 'OpenSUSE-Tumbleweed_amd64' }

    steps:
    - name: Install git for checkout
      run: |
        case "${{ matrix.cfg.image }}" in
          opensuse*)
            # The permissions package fails to set file capabilities in this
            # container. Lock it so zypper does not try to update it.
            zypper -n al permissions || true
            zypper -n refresh
            # Tumbleweed ships busybox-gawk, which conflicts with gawk.
            # --force-resolution removes that provider instead of aborting.
            zypper -n install --force-resolution git
            ;;
          *)
            dnf -y install git
            ;;
        esac

    - name: Checkout
      uses: actions/checkout@v6

    - name: Install dependencies
      # openal/alut/ogg/vorbis are in Fedora and openSUSE, not Rocky.
      # unixODBC-devel is in Rocky's CRB repo, which ships disabled.
      # openSUSE spells several devel packages differently from Fedora.
      run: |
        case "${{ matrix.cfg.image }}" in
          opensuse*)
            zypper -n al permissions || true
            # rpm-build requires gawk. The Tumbleweed image has busybox-gawk,
            # and a non-interactive install cancels that conflict unless the
            # solver is allowed to replace it. The same applies to other
            # busybox-* packages this image uses in place of the real tools.
            zypper -n install --force-resolution rpm-build gcc make diffutils \
              libjpeg8-devel libpng16-devel libX11-devel \
              Mesa-libGL-devel glu-devel \
              libopenssl-3-devel libssh-devel unixODBC-devel \
              freetype2-devel libXft-devel \
              openal-soft-devel freealut-devel libogg-devel libvorbis-devel
            ;;
          *)
            case "${{ matrix.cfg.image }}" in
              rocky*) enablerepo="--enablerepo=crb" ;;
              *) enablerepo="" ;;
            esac
            dnf -y $enablerepo install rpm-build rpmdevtools gcc make diffutils \
              libjpeg-turbo-devel libpng-devel libX11-devel \
              mesa-libGL-devel mesa-libGLU-devel \
              openssl-devel libssh-devel unixODBC-devel freetype-devel libXft-devel
            case "${{ matrix.cfg.image }}" in
              fedora*) dnf -y install openal-soft-devel freealut-devel libogg-devel libvorbis-devel ;;
            esac
            ;;
        esac

    # Same pattern as the Deb job: one dependency install, two packages.
    - name: Rpm
      run: |
        ./configure
        base="${GITHUB_RUN_NUMBER}.$(printf %.12s "$GITHUB_SHA")"
        rm -rf ../rpmbuild
        export UNICON_PKG_REV="$base"
        unset UNICON_CONFIGURE_EXTRA
        make rpmbin
        # Keep the first packages outside the tree. The next make rpmbin runs
        # make dist, which archives the checkout. rpm-pkg is the downloads
        # page (binaries). rpm-repo also keeps the src.rpm.
        mkdir -p "${RUNNER_TEMP}/rpm-pkg" "${RUNNER_TEMP}/rpm-repo"
        cp ../rpmbuild/RPMS/*/*.rpm "${RUNNER_TEMP}/rpm-pkg/"
        cp ../rpmbuild/RPMS/*/*.rpm "${RUNNER_TEMP}/rpm-repo/"
        if ls ../rpmbuild/SRPMS/unicon-*.src.rpm >/dev/null 2>&1; then
          cp ../rpmbuild/SRPMS/unicon-*.src.rpm "${RUNNER_TEMP}/rpm-repo/"
        fi
        rm -rf ../rpmbuild
        export UNICON_PKG_REV="$base"
        export UNICON_CONFIGURE_EXTRA="--disable-graphics --disable-audio"
        make rpmbin
        mkdir -p rpm-pkg rpm-pkg-nographics rpm-repo rpm-repo-nographics
        cp "${RUNNER_TEMP}/rpm-pkg/"*.rpm rpm-pkg/
        cp -a "${RUNNER_TEMP}/rpm-repo/." rpm-repo/
        cp ../rpmbuild/RPMS/*/unicon-runtime-nographics-*.rpm rpm-pkg-nographics/
        cp ../rpmbuild/RPMS/*/unicon-runtime-nographics-*.rpm rpm-repo-nographics/
        # %autosetup -n unicon uses BUILD/unicon for both packages, so the
        # graphics ucode's absolute links point at this nographics rebuild.
        # make Test then links two compilations of the same modules
        # (inconsistent redeclaration). The rpms are already copied out.
        rm -rf ../rpmbuild

    - name: Publish
      uses: actions/upload-artifact@v6
      with:
        name: rpm-${{ matrix.cfg.name }}
        path: rpm-pkg/*.rpm
        if-no-files-found: warn

    - name: Publish no-graphics
      uses: actions/upload-artifact@v6
      with:
        name: rpm-${{ matrix.cfg.name }}-nographics
        path: rpm-pkg-nographics/*.rpm
        if-no-files-found: warn

    - name: Publish repo
      uses: actions/upload-artifact@v6
      with:
        name: repo-rpm-${{ matrix.cfg.name }}
        path: rpm-repo/*
        if-no-files-found: error

    - name: Publish repo no-graphics
      uses: actions/upload-artifact@v6
      with:
        name: repo-rpm-${{ matrix.cfg.name }}-nographics
        path: rpm-repo-nographics/*
        if-no-files-found: error

    - name: Install and test
      run: |
        # unicon-nographics depends on unicon-runtime-nographics, which is
        # built by the other configure and is not in this directory.
        set --
        for f in ./rpm-pkg/*.rpm; do
          case "$f" in
            ./rpm-pkg/unicon-nographics-*) continue ;;
          esac
          if [ -f "$f" ]; then
            set -- "$@" "$f"
          fi
        done
        if [ ! -f "$1" ]; then
          echo "No .rpm packages under rpm-pkg/; did the Rpm step succeed?"
          exit 1
        fi
        case "${{ matrix.cfg.image }}" in
          opensuse*)
            zypper -n --no-gpg-checks install --allow-unsigned-rpm "$@"
            ;;
          *)
            dnf -y install "$@"
            ;;
        esac
        make Test
        rpm -qp --requires ./rpm-pkg/unicon-nographics-*.rpm | grep -q unicon-runtime-nographics
        # The no-graphics runtime conflicts with unicon-runtime.
        rpm -qp --provides ./rpm-pkg-nographics/unicon-runtime-nographics-*.rpm | grep -qx unicon-vm
        rpm -qp --conflicts ./rpm-pkg-nographics/unicon-runtime-nographics-*.rpm | grep -qx unicon-runtime
      env:
        UC: unicon

  # Arch and CachyOS share one PKGBUILD. CachyOS is its own container so the
  # binaries are built with that image's compiler flags. Both produce the
  # full split, including unicon-runtime-nographics. repo-arch-* is the
  # unsigned pacman database the Pages site publishes.
  Arch:
    runs-on: ubuntu-latest
    name: ${{ matrix.cfg.name }}
    container: ${{ matrix.cfg.image }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cfg:
        - { image: 'archlinux:base-devel', name: 'Arch-x86_64' }
        - { image: 'cachyos/cachyos', name: 'CachyOS-x86_64' }

    steps:
    - name: Install dependencies
      run: |
        pacman -Syu --needed --noconfirm git base-devel \
          libx11 libxft freetype2 mesa glu libpng libjpeg-turbo \
          openssl libssh unixodbc openal freealut libvorbis libogg

    - name: Checkout
      uses: actions/checkout@v6

    - name: Package
      run: |
        base="${GITHUB_RUN_NUMBER}.$(printf %.12s "$GITHUB_SHA")"
        useradd -m builder
        mkdir -p arch-pkg
        chown -R builder:builder "$PWD"
        su builder -c "cd arch && env UNICON_PKG_REV='${base}' PKGDEST='${PWD}/arch-pkg' makepkg --noconfirm"
        mkdir -p arch-pkg-nographics
        cp arch-pkg/unicon-runtime-nographics-*.pkg.tar.zst arch-pkg-nographics/
        # Full set, including unicon-nographics, so one pacman repo can
        # install either metapackage. upload-artifact drops symlinks, so
        # the names pacman fetches are real files.
        mkdir -p arch-repo/x86_64
        cp arch-pkg/*.pkg.tar.zst arch-repo/x86_64/
        repo-add arch-repo/x86_64/unicon.db.tar.zst arch-repo/x86_64/*.pkg.tar.zst
        rm -f arch-repo/x86_64/unicon.db arch-repo/x86_64/unicon.files
        cp arch-repo/x86_64/unicon.db.tar.* arch-repo/x86_64/unicon.db
        cp arch-repo/x86_64/unicon.files.tar.* arch-repo/x86_64/unicon.files
        ls -lh arch-pkg arch-pkg-nographics arch-repo/x86_64

    - name: Publish
      uses: actions/upload-artifact@v6
      with:
        name: arch-${{ matrix.cfg.name }}
        path: arch-pkg/*.pkg.tar.zst
        if-no-files-found: error

    - name: Publish no-graphics
      uses: actions/upload-artifact@v6
      with:
        name: arch-${{ matrix.cfg.name }}-nographics
        path: arch-pkg-nographics/*.pkg.tar.zst
        if-no-files-found: error

    - name: Publish pacman repo
      uses: actions/upload-artifact@v6
      with:
        name: repo-arch-${{ matrix.cfg.name }}
        path: arch-repo/x86_64/*
        if-no-files-found: error

    - name: Install and test
      # unicon and unicon-nographics conflict. The no-graphics runtime
      # conflicts with unicon-runtime, so the test install is the graphics
      # set. The other two packages are checked from their metadata.
      run: |
        set --
        for f in ./arch-pkg/*.pkg.tar.zst; do
          case "$f" in
            ./arch-pkg/unicon-nographics-*|./arch-pkg/unicon-runtime-nographics-*)
              continue
              ;;
          esac
          if [ -f "$f" ]; then
            set -- "$@" "$f"
          fi
        done
        if [ ! -f "$1" ]; then
          echo "No Arch packages under arch-pkg/; did the Package step succeed?"
          exit 1
        fi
        pacman -U --noconfirm "$@"
        make Test
        pacman -Qpi ./arch-pkg/unicon-nographics-*.pkg.tar.zst | grep -q unicon-runtime-nographics
        pacman -Qpi ./arch-pkg/unicon-runtime-nographics-*.pkg.tar.zst | grep -q unicon-vm
      env:
        UC: unicon

  # One orig tarball, per-suite .dsc, and rpm trees for the local reprepro
  # and createrepo repos. Channel (dev/rc/release) is chosen when publishing,
  # not here; master is dev, a tag containing "rc" is rc, any other tag is
  # release. See config/scripts/pkg-repo/.
  stage-repo:
    name: Stage repository incoming
    needs: [Deb, Rpm]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Download repo artifacts
      uses: actions/download-artifact@v6
      continue-on-error: true
      with:
        pattern: repo-*
        path: raw-incoming

    - name: Share one orig tarball and lay out suites
      run: bash config/scripts/pkg-repo/assemble-repo-incoming.sh raw-incoming repo-incoming

    - name: Publish repo-incoming
      uses: actions/upload-artifact@v6
      with:
        name: repo-incoming
        path: repo-incoming
        if-no-files-found: error

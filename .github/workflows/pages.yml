# GitHub Pages site under /unicon/ (github.io project pages).
#
# Built by config/scripts/gh-pages/build-gh-pages-site.sh (pandoc + nav).
# Also builds the uscribe user guide (doc/uscribe) so generated HTML
# and uscribe-userguide.pdf are included under doc/uscribe/out/, and
# RST Unicon Technical Reports (make -C doc/utr html) under doc/utr/html/.
#
# Upstream (uniconproject/unicon): a push to master/main builds the site
# and publishes it with actions/deploy-pages. Generated HTML is not in
# git, so "Deploy from a branch → master" cannot serve it (Jekyll on the
# source tree also cannot). Settings → Pages → Source: GitHub Actions.
#
# Forks: still push the same tree to that fork's gh-pages branch
# (peaceiris), e.g. https://jafaral.github.io/unicon/ — set the fork's
# Pages source to branch gh-pages / (root).
#
# Fork PRs against upstream: GITHUB_TOKEN cannot publish the project
# site. Preview on the fork after a push there (forks may still use a
# gh-pages branch). The project site updates when the PR merges to
# master.

name: Pages

on:
  push:
    # Upstream deploys only from master/main (job if). Forks deploy any branch.
    branches:
      - '**'
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'COPYING'
      - 'doc/**'
      - 'uni/uscribe/**'
      - 'config/editor/**'
      - 'config/scripts/gh-pages/**'
      - 'config/scripts/pkg-repo/**'
      - '.github/workflows/pages.yml'
      - 'debian/control'
      - 'configure.ac'
      - 'Makefile'
      - 'Makedefs*'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'COPYING'
      - 'doc/**'
      - 'uni/uscribe/**'
      - 'config/editor/**'
      - 'config/scripts/gh-pages/**'
      - 'config/scripts/pkg-repo/**'
      - '.github/workflows/pages.yml'
      - 'debian/control'
      - 'configure.ac'
      - 'Makefile'
      - 'Makedefs*'
  workflow_dispatch:
  # Re-deploy after Binary Packages finishes so /unicon/downloads/ picks up the packages
  # built from the commit that just landed, without the docs-only push having to wait on
  # the (much longer) package build matrix first.
  workflow_run:
    workflows: ['Binary Packages']
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  # actions: read lets the build job's `gh run download` pull the latest Binary Packages
  # artifacts (deb/rpm) into the downloads page.
  actions: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      (
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          (
            github.event.workflow_run.head_branch == 'master' ||
            github.event.workflow_run.head_branch == 'main'
          )
        )
      ) &&
      (
        github.repository == 'uniconproject/unicon' ||
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      (
        github.repository != 'uniconproject/unicon' ||
        github.event_name != 'push' ||
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Pandoc and TeX (uscribe PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc reprepro createrepo-c \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended

      - name: Install Unicon build dependencies
        run: |
          sudo apt-get install -q -y devscripts equivs
          sudo mk-build-deps --install debian/control

      - name: Configure Unicon (no graphics/iconc; enough for uscribe)
        run: ./configure --disable-graphics --disable-iconc

      - name: Build Unicon
        run: make -j"$(nproc)"

      - name: Build uscribe user guide HTML and PDF
        run: |
          make -C doc/uscribe html pdf
          test -f doc/uscribe/out/index.html
          test -f doc/uscribe/out/uscribe-userguide.pdf

      - name: Build RST Unicon Technical Reports
        run: |
          make -C doc/utr pdf-rst
          make -C doc/utr html
          test -f doc/utr/html/index.html
          # Every RST report in utr.manifest must have been rendered.
          while read -r src; do
            case "$src" in
              ''|\#*) continue ;;
            esac
            base="${src%.rst}"
            test -f "doc/utr/html/${base}.html"
          done < doc/utr/utr.manifest

      - name: Build site
        env:
          UNICON_SITE_PREFIX: /unicon
        run: bash config/scripts/gh-pages/build-gh-pages-site.sh _site

      # Unsigned dev apt/dnf/pacman repos from the latest master package run.
      # Signed rc/stable/13.3 stay on the local publish path. Windows remains
      # a direct download. See config/scripts/pkg-repo/publish-unsigned-dev.sh.
      - name: Publish unsigned dev repositories
        if: github.repository == 'uniconproject/unicon'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # workflow_run carries the package run that just finished, and only when
          # that run was on master or main. A manual dispatch from another branch
          # must not publish here. Other events leave these empty and the script
          # looks up the latest success on master. updated_at is taken from that
          # same event or list entry, not a second API call: the date is optional
          # page text and must not stop publication if it is missing.
          PACKAGE_RUN_ID: ${{ github.event_name == 'workflow_run' && (github.event.workflow_run.head_branch == 'master' || github.event.workflow_run.head_branch == 'main') && github.event.workflow_run.id || '' }}
          PACKAGE_RUN_UPDATED: ${{ github.event_name == 'workflow_run' && (github.event.workflow_run.head_branch == 'master' || github.event.workflow_run.head_branch == 'main') && github.event.workflow_run.updated_at || '' }}
        run: |
          set -euo pipefail
          mkdir -p _site/downloads "${RUNNER_TEMP}/repo-incoming" "${RUNNER_TEMP}/repo-arch"
          run_id="${PACKAGE_RUN_ID}"
          run_updated="${PACKAGE_RUN_UPDATED}"
          if [ -z "$run_id" ]; then
            meta=$(gh run list --workflow packages.yml --branch master --status success \
              --limit 1 --json databaseId,updatedAt \
              --jq '.[0] | select(.databaseId != null) | "\(.databaseId) \(.updatedAt)"')
            run_id=${meta%% *}
            run_updated=${meta#* }
            # No timestamp in the list entry: the remainder is the id itself.
            if [ "$run_updated" = "$run_id" ]; then
              run_updated=""
            fi
          fi
          if [ -z "$run_id" ]; then
            echo "No successful Binary Packages run yet for master; downloads page will say so."
          else
            echo "Pulling package artifacts from Binary Packages run ${run_id}"
            got=0
            # One --name extracts into the directory. A pattern creates a subdirectory per artifact.
            if gh run download "$run_id" --name repo-incoming --dir "${RUNNER_TEMP}/repo-incoming"; then
              got=1
            else
              echo "No repo-incoming artifact"
            fi
            if gh run download "$run_id" --pattern 'repo-arch-*' --dir "${RUNNER_TEMP}/repo-arch"; then
              got=1
            else
              echo "No repo-arch artifacts"
            fi
            if gh run download "$run_id" --pattern 'win-*' --dir _site/downloads; then
              got=1
            else
              echo "No Windows artifacts"
            fi
            if [ "$got" -eq 1 ]; then
              # updatedAt is when the run finished, which is when these packages were published.
              when=""
              if [ -n "$run_updated" ]; then
                when=$(date -u -d "$run_updated" '+%Y-%m-%d %H:%M UTC' || true)
              fi
              printf '%s\n%s\n' "$run_id" "$when" > _site/downloads/.run_id
            fi
          fi
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          bash config/scripts/pkg-repo/publish-unsigned-dev.sh \
            "${RUNNER_TEMP}/repo-incoming" \
            "${RUNNER_TEMP}/repo-arch" \
            _site/pkgs \
            "https://${owner}.github.io/${name}"

      - name: Build downloads index page
        run: |
          set -euo pipefail
          mkdir -p _site/downloads
          out=_site/downloads/index.html
          run_note='<p><em>No successful package build yet.</em></p>'
          if [ -f _site/downloads/.run_id ]; then
            rid=$(sed -n '1p' _site/downloads/.run_id)
            when=$(sed -n '2p' _site/downloads/.run_id)
            run_note="<p>From <a href=\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${rid}\">Binary Packages run ${rid}</a>"
            if [ -n "$when" ]; then
              run_note="${run_note}, updated ${when}"
            fi
            run_note="${run_note}.</p>"
            rm -f _site/downloads/.run_id
          fi
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<title>Unicon downloads</title>'
            cat config/scripts/gh-pages/includes/header.html
            echo '</head><body>'
            cat config/scripts/gh-pages/includes/before-body.html
            echo '<main style="max-width:60rem;margin:2rem auto;padding:0 1rem;font-family:sans-serif">'
            base="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}"
            echo '<h1>Development packages</h1>'
            echo '<p>Built automatically from the latest <code>master</code> commit.'
            echo ' These repositories are <strong>unsigned</strong> and contain only'
            echo ' the <code>dev</code> component. <code>apt install unicon</code> is the'
            echo ' graphics set. <code>apt install unicon-nographics</code> is the same'
            echo ' set around the virtual machine built with'
            echo ' <code>--disable-graphics</code> and <code>--disable-audio</code>.'
            echo ' The two metapackages conflict. Signed release repositories are'
            echo ' published separately.</p>'
            echo "$run_note"
            echo '<h2>Debian / Ubuntu</h2>'
            if [ -d _site/pkgs/deb/dists ]; then
              echo '<pre><code>. /etc/os-release'
              echo "printf 'Types: deb\\nURIs: ${base}/pkgs/deb\\nSuites: %s\\nComponents: dev\\nTrusted: yes\\n' \"\$VERSION_CODENAME\" | sudo tee /etc/apt/sources.list.d/unicon-dev.sources"
              echo 'sudo apt update'
              echo 'sudo apt install unicon</code></pre>'
              echo '<p>Suites: bookworm, trixie, jammy, noble, resolute. amd64 and arm64.</p>'
            else
              echo '<p><em>No apt repository in this build yet.</em></p>'
            fi
            echo '<h2>Fedora / Rocky Linux</h2>'
            if find _site/pkgs/rpm/fedora _site/pkgs/rpm/rocky -name repomd.xml -print -quit 2>/dev/null | grep -q .; then
              echo '<p>Fedora:</p>'
              echo "<pre><code>sudo dnf config-manager --add-repo ${base}/pkgs/rpm/unicon-fedora.repo"
              echo 'sudo dnf install unicon</code></pre>'
              echo '<p>Rocky Linux:</p>'
              echo "<pre><code>sudo dnf config-manager --add-repo ${base}/pkgs/rpm/unicon-rocky.repo"
              echo 'sudo dnf install unicon</code></pre>'
              echo '<p>Fedora 44 and Rocky Linux 9, x86_64. The packages are not interchangeable.</p>'
            else
              echo '<p><em>No dnf repository in this build yet.</em></p>'
            fi
            echo '<h2>openSUSE</h2>'
            if find _site/pkgs/rpm/opensuse -name repomd.xml -print -quit 2>/dev/null | grep -q .; then
              echo '<p>Leap 16.0:</p>'
              echo "<pre><code>sudo zypper addrepo ${base}/pkgs/rpm/unicon-leap.repo"
              echo 'sudo zypper refresh'
              echo 'sudo zypper install unicon</code></pre>'
              echo '<p>Tumbleweed:</p>'
              echo "<pre><code>sudo zypper addrepo ${base}/pkgs/rpm/unicon-tumbleweed.repo"
              echo 'sudo zypper refresh'
              echo 'sudo zypper install unicon</code></pre>'
              echo '<p>Leap 16.0 and Tumbleweed, x86_64. They are not interchangeable'
              echo ' with each other or with the Fedora and Rocky packages.</p>'
            else
              echo '<p><em>No zypper repository in this build yet.</em></p>'
            fi
            echo '<h2>Arch Linux / CachyOS</h2>'
            if [ -f _site/pkgs/arch/x86_64/unicon.db ] || [ -f _site/pkgs/cachyos/x86_64/unicon.db ]; then
              echo '<p>Arch Linux and CachyOS are separate repositories. Append the matching block to <code>/etc/pacman.conf</code>:</p>'
              echo '<pre><code>[unicon-dev]'
              echo "Server = ${base}/pkgs/arch/\$arch"
              echo 'SigLevel = Never</code></pre>'
              echo '<p>On CachyOS use <code>/pkgs/cachyos/</code> instead of <code>/pkgs/arch/</code>, then <code>sudo pacman -Sy unicon</code>.</p>'
            else
              echo '<p><em>No pacman repository in this build yet.</em></p>'
            fi
            echo '<h2>Windows</h2>'
            echo '<p>Download the 64-bit <code>.exe</code> and run it. The installer'
            echo ' is unsigned, so Windows may report an unknown publisher.'
            echo ' It adds the Unicon <code>bin</code> directory to the system'
            echo ' <code>PATH</code>. Open a new terminal after installation so the'
            echo ' updated path is picked up. A path containing <code>nographics</code>'
            echo ' is built with <code>--disable-graphics</code> and <code>--disable-audio</code>.</p>'
            echo '<ul>'
            found=0
            for d in _site/downloads/win-*/; do
              [ -d "$d" ] || continue
              for f in "$d"*; do
                [ -f "$f" ] || continue
                case "$f" in
                  *.exe) ;;
                  *) continue ;;
                esac
                rel="${f#_site/downloads/}"
                echo "<li><a href=\"${rel}\">${rel}</a></li>"
                found=1
              done
            done
            if [ "$found" -eq 0 ]; then
              echo '<li><em>none yet</em></li>'
            fi
            echo '</ul>'
            echo '</main>'
            cat config/scripts/gh-pages/includes/after-body.html
            echo '</body></html>'
          } > "$out"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 3

  deploy-production:
    # uniconproject: publish a master/main push, a manual dispatch, or a Binary Packages
    # run whose head branch is master or main. workflow_run sets github.ref to the
    # default branch even when the package run was started from somewhere else, so the
    # triggering head branch has to be checked on its own.
    if: >-
      github.repository == 'uniconproject/unicon' &&
      github.event_name != 'pull_request' &&
      (
        github.event.workflow_run.head_branch == 'master' ||
        github.event.workflow_run.head_branch == 'main' ||
        (
          github.event_name != 'workflow_run' &&
          (
            github.ref == 'refs/heads/master' ||
            github.ref == 'refs/heads/main' ||
            github.event_name == 'workflow_dispatch'
          )
        )
      )
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-production-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  deploy-fork:
    # Forks: any push/dispatch → that fork's gh-pages branch.
    if: >-
      github.repository != 'uniconproject/unicon' &&
      github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-gh-pages-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Deploy to gh-pages (site root)
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: true
          commit_message: "Deploy Pages ${{ github.sha }}"

  # Fork PRs cannot publish uniconproject.github.io; point authors at the fork.
  skip-preview-fork:
    if: >-
      github.repository == 'uniconproject/unicon' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Note fork preview location
        env:
          FORK_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        run: |
          echo "### Pages preview skipped on upstream"
          echo "This fork PR does not publish https://uniconproject.github.io/unicon/"
          echo "The project site updates when the PR merges to master."
          echo "Live preview (after push to the fork with Pages enabled):"
          echo "  https://${FORK_OWNER}.github.io/unicon/"
          echo "  https://${FORK_OWNER}.github.io/unicon/doc/uscribe/out/"
          echo "  https://${FORK_OWNER}.github.io/unicon/doc/utr/html/"

      - name: Comment that fork PR preview was skipped
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const owner = context.payload.pull_request.head.repo.owner.login;
            const forkSite = `https://${owner}.github.io/unicon/`;
            const guide = `${forkSite}doc/uscribe/out/`;
            const utr = `${forkSite}doc/utr/html/`;
            const marker = '<!-- pages-pr-preview-skipped -->';
            const body =
              `${marker}\n` +
              `### Pages preview skipped on upstream\n\n` +
              `This PR is from a fork, so it cannot publish ` +
              `https://uniconproject.github.io/unicon/.\n\n` +
              `The project site updates when this merges to \`master\`. ` +
              `For a live preview, push to your fork (Actions enabled; ` +
              `Pages → Deploy from a branch \`gh-pages\` / (root)). ` +
              `Site:\n` +
              `- ${forkSite}\n` +
              `- uscribe guide: ${guide}\n` +
              `- Technical reports (RST): ${utr}\n`;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
              });
              if (comments.some(c => c.body && c.body.includes(marker))) return;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            } catch (err) {
              core.warning(
                `Could not comment on PR #${pr} (fork PRs often lack ` +
                `pull-requests: write): ${err.message}`
              );
            }
